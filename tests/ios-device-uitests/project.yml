# UI-test runner for the sample app on a physical iPhone. A placeholder host app plus the AgeledgerUITests bundle.
# Signing is not set here: scripts/ios-uitests.sh passes the team and profile on the xcodebuild command line.
# Regenerate the (untracked) project with `xcodegen`. The sample's bundle id is the build setting AGELEDGER_SAMPLE_ID (scripts/ios-uitests.sh passes it).
name: AgeledgerUITests
options:
  bundleIdPrefix: com.ageledger.sample
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    # The sample's bundle id; scripts/ios-uitests.sh passes the real one as a build setting.
    AGELEDGER_SAMPLE_ID: com.ageledger.sample
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGELEDGER_SAMPLE_ID).uitests.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AgeledgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AgeledgerUITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGELEDGER_SAMPLE_ID).uitests
        TEST_TARGET_NAME: Host
schemes:
  AgeledgerUITests:
    build:
      targets:
        Host: all
        AgeledgerUITests: [test]
    test:
      targets: [AgeledgerUITests]
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
